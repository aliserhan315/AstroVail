name: CI (Backend)

on:
  pull_request:
    branches: [main]
    paths:
      - 'Backend/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - '.github/workflows/**'

concurrency:
  group: backend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      NODE_OPTIONS: --experimental-vm-modules
      CI: true
      # Pin a known-good MongoDB for mongodb-memory-server to reduce flakiness
      MONGOMS_VERSION: '7.0.14'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Sanity check files
        run: |
          ls -la src/modules/checkout
          test -f src/modules/checkout/checkout.service.js

      - name: Clear Jest cache
        run: npx --yes jest --clearCache

      - name: Run tests
        run: npm run test
