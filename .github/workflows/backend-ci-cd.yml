name: CI (Backend)

on:
  pull_request:
    branches: [main]
    paths:
      - 'Backend/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - '.github/workflows/**'

concurrency:
  group: backend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      NODE_OPTIONS: --experimental-vm-modules
      USE_MEM_MONGO: 'false'
      MONGODB_URI: ${{ secrets.MONGODB_URI_TEST }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Sanity check files
        run: |
          ls -la src/modules/checkout
          test -f src/modules/checkout/checkout.service.js

      - name: Clear Jest cache
        run: npx --yes jest --clearCache

      - name: Run tests
        run: npx --yes jest --runInBand
