name: "CI (Backend)"

on:
  pull_request:
    branches: [main]
    paths:
      - 'Backend/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - '.github/workflows/**'

concurrency:
  group: backend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - name: Debug repo structure
        run: |
          pwd
          ls -la
          ls -la src || true
          ls -la src/modules/checkout || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install deps
        run: npm ci --include=dev

      - name: Check jest presence
        run: |
          npm ls jest || true
          npx --yes jest --version

      - name: Run tests
        run: npx --yes jest --runInBand
        env:
          NODE_OPTIONS: --experimental-vm-modules
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
          MONGODB_URI: ${{ secrets.MONGODB_URI_TEST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
       
