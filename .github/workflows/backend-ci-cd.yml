name: "CI (Backend)"

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/**'

concurrency:
  group: backend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            **/package-lock.json

      - name: Install deps
        run: npm ci --include=dev

      - name: Debug checkout module paths
        run: |
          pwd
          ls -la
          ls -la src/modules/checkout || true
          echo "Import lines in controller (if file exists):"
          grep -n "checkout.service" src/modules/checkout/checkout.controller.js || true

      - name: Run tests
        run: npm run test
        env:
          NODE_OPTIONS: --experimental-vm-modules
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
          MONGODB_URI: ${{ secrets.MONGODB_URI_TEST }}
